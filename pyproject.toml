[project]
name = "kz-verify"
version = "0.1.0"
description = "Free verifier for the AI labelling of Tom Langer's local AI pipeline (EU AI Act Art. 50(2)): TrustMark / AudioSeal watermark + C2PA manifest."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "trustmark==0.9.2",
    "audioseal==0.2.1",
    "torch>=2.5",
    "torchvision>=0.20",
    "pillow>=11",
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.12",
]

[project.scripts]
kz-verify = "kz_verify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kz_verify"]
